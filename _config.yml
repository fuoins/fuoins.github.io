# 博客基础配置
title: "Fuoins' Blog"
email: your-email@example.com
description: >-
  一个基于 Jekyll 构建的高级感白色调博客，专注技术分享与思考，适配全终端设备，完美支持数学公式渲染与自动换行，为你带来极致的阅读体验。
baseurl: "" # 若部署在根目录则为空
url: "https://fuoins.github.io" # 你的博客域名
twitter_username: fuoins
github_username:  fuoins

# 构建配置
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/
paginate: 5
paginate_path: "/page/:num/"

# 插件（需确保本地安装或GitHub Pages支持）
plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-feed

# 数学公式配置
math:
  enable: true
  mathjax:
    src: "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
    config: |
      MathJax.Hub.Config({
        tex2jax: {
          inlineMath: [['$','$'], ['\\(','\\)']],
          displayMath: [['$$','$$'], ['\\[','\\]']],
          processEscapes: true,
          processEnvironments: true,
          autoNumber: "AMS",
          skipTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
        },
        "HTML-CSS": {
          linebreaks: { automatic: true } # 公式自动换行
        },
        SVG: {
          linebreaks: { automatic: true }
        }
      });

# 主题相关
theme: null # 禁用默认主题，使用自定义样式
sass:
  sass_dir: _sass
  style: compressed

# 自定义变量
collections:
  posts:
    output: true
    permalink: /posts/:title/

# 响应式配置
responsive:
  breakpoints:
    mobile: 768px
    tablet: 992px
    desktop: 1200px

# 站点导航
nav:
  - title: "首页"
    url: "/"
  - title: "文章"
    url: "/posts/"
  - title: "关于"
    url: "/about/"