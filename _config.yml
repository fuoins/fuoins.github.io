# 基础配置
title: fuoins's Blog
email: your-email@example.com
description: "极简风格的技术博客"
baseurl: "" # 部署到根域名时留空
url: "https://fuoins.github.io" # 替换为你的实际域名
permalink: /:year/:month/:day/:title/
lang: zh-CN

# Jekyll 核心配置（适配 github-pages v232 + jekyll v3.10.0）
markdown: kramdown
kramdown:
  math_engine: mathjax # 启用MathJax渲染数学公式
  syntax_highlighter: rouge
  input: GFM # 支持GitHub Flavored Markdown

# 仅保留必要插件（github-pages 内置，无需额外安装）
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# 禁用非必要功能
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# 移动端适配相关
responsive: true