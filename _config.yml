# ============================================
# 站点基础信息
# ============================================
title: "ZY's Notes"
subtitle: "以技术为帆，探索无限可能"
description: "赵宇的个人技术博客，记录编程、数学与软件工程的思考与实践。"
keywords: "编程, 数学, Java, Python, Go, 技术博客, ZY"
author:
  name: "赵宇"
  nickname: "ZY"
  email: "2627737542@qq.com"
  github: "fuoins"
  url: "https://fuoins.github.io"

# 站点 URL（GitHub Pages）
url: "https://fuoins.github.io"
baseurl: ""

# ============================================
# 核心配置（无插件，GitHub Pages 兼容）
# ============================================
permalink: /posts/:year/:month/:day/:title/
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter_opts:
    disable: false
    line_numbers: false
  math_engine: mathjax
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6

# 页面排除
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - .gitignore
  - .github

# ============================================
# 导航菜单
# ============================================
nav:
  - name: "首页"
    url: "/"
  - name: "文章"
    url: "/pages/archive/"
  - name: "学习资源"
    url: "/pages/writing/"
  - name: "关于我"
    url: "/pages/about/"

# ============================================
# 时间格式
# ============================================
timezone: Asia/Shanghai
date_format: "%Y-%m-%d %H:%M:%S"

# 移动端适配
viewport: "width=device-width, initial-scale=1.0"

# 静态资源缓存策略（配合 Cloudflare）
headers:
  - path: "/*.jpg"
    values:
      Cache-Control: "public, max-age=31536000, immutable"
  - path: "/*.png"
    values:
      Cache-Control: "public, max-age=31536000, immutable"
  - path: "/*.webp"
    values:
      Cache-Control: "public, max-age=31536000, immutable"
  - path: "/*.gif"
    values:
      Cache-Control: "public, max-age=31536000, immutable"

# 页面布局默认值
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
