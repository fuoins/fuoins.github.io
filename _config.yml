# Site settings
title: SBZY's Blog
description: 一个专注于技术、编程和思考的博客
baseurl: "" # 如果托管在子路径，例如"/blog"，则填写"/blog"
url: "https://sbzy666.github.io" # 您的域名
github_username: sbzy666

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/
paginate: 5
paginate_path: /page:num/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap

# Collections
collections:
  archive:
    output: true
    permalink: /archive/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: true
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# Navigation
navigation:
  - title: 首页
    url: /
  - title: 归档
    url: /archive.html
  - title: 关于
    url: /about.html

# Social links
social:
  github: sbzy666
  email: sbzy666@example.com

# Search
search: true

# MathJax支持
mathjax: true

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - LICENSE

# 主题设置
theme_color: "#4a86e8"
accent_color: "#ff6b6b"
background_color: "#ffffff"
text_color: "#333333"
secondary_text_color: "#666666"
border_color: "#eaeaea"

# 作者信息
author:
  name: "SBZY"
  bio: "热爱技术的程序员，喜欢分享知识"
  avatar: "/img/avatar.jpg"

# 评论系统 (可选)
comments:
  disqus:
    shortname: "sbzyblog"

# 分析工具
analytics:
  google: "UA-XXXXXXXXX-X" # 替换为您的Google Analytics ID

# SEO设置
seo:
  title: true
  description: true
  author: true
  twitter_card: summary_large_image
  og_image: "/img/og-image.jpg"

# 时间格式
date_format: "%Y年%m月%d日"
time_format: "%H:%M"

# 分页
paginate: 5
paginate_path: "/page/:num/"

# 语法高亮
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

# 自定义变量
custom:
  max_related_posts: 3
  show_reading_time: true
  reading_time_words_per_minute: 200