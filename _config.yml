# 站点基础配置
title: fuoins' Blog
email: your-email@example.com
description: >-
  一个基于Jekyll构建的高级感白色调博客，支持数学公式渲染，完美适配移动端
baseurl: ""
url: "https://fuoins.github.io"
twitter_username: fuoins
github_username: fuoins

# Jekyll 核心配置 - 适配 GitHub Pages v232
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

# 关键修改：移除 math_engine: mathjax（GitHub Pages 环境下会冲突）
# 改用前端渲染方式处理数学公式

# 构建配置
permalink: /:year/:month/:day/:title/
paginate: 5
paginate_path: /page/:num/
timezone: Asia/Shanghai

# 关键修改：只保留 GitHub Pages v232 兼容的插件
# 移除不必要的插件声明，避免冲突
plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# 禁用主题
theme: null

# 自定义变量
collections:
  posts:
    output: true
    permalink: /posts/:name/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "fuoins"
  - scope:
      path: ""
    values:
      layout: "default"

# 数学公式配置 - 简化版（避免与 GitHub Pages 冲突）
math:
  enable: true
  mathjax:
    src: "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
    config: |
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          processEscapes: true,
          autoload: {
            color: [],
            colorv2: ['color']
          },
          packages: {'[+]': ['noerrors']}
        },
        svg: {
          fontCache: 'global'
        },
        options: {
          enableMenu: false
        },
        startup: {
          pageReady: function() {
            return MathJax.startup.defaultPageReady().then(function() {
              // 处理公式换行
              document.querySelectorAll('.mjx-chtml').forEach(el => {
                el.style.maxWidth = '100%';
                el.style.overflowX = 'auto';
                el.style.display = 'inline-block';
              });
            });
          }
        }
      };