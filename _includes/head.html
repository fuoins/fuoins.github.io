<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="{{ site.viewport }}">
  <meta name="author" content="{{ site.author.name }}">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="keywords" content="{{ page.keywords | default: site.keywords }}">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} · {{ site.subtitle }}{% endif %}</title>

  <!-- 主题样式 -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">

  <!-- MathJax 3.x：数学公式渲染 -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        autoload: { color: [], colorv2: ['color'] }
      },
      chtml: {
        scale: 1.02,
        displayAlign: 'left',
        displayIndent: '1em',
        linebreaks: { automatic: true, width: '100%', linebreakAtWhitespace: true }
      },
      options: {
        enableMenu: false,
        ignoreHtmlClass: 'tex2jax_ignore',
        processHtmlClass: 'tex2jax_process'
      },
      startup: {
        pageReady: function () {
          return MathJax.startup.defaultPageReady().then(function () {
            document.querySelectorAll('mjx-container').forEach(function (el) {
              el.style.maxWidth = '100%';
              el.style.overflowX = 'hidden';
              el.style.margin = '1.5rem 0';
            });
          });
        }
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script"></script>
</head>
