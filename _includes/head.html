<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">

    <!-- SEO优化 -->
    <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
    <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ "/assets/images/og-image.png" | absolute_url }}">

    <!-- 移动端适配 -->
    <meta name="apple-mobile-web-app-title" content="{{ site.title }}">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="white">

    <!-- 样式文件 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/normalize.css@8.0.1/normalize.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}">

    <!-- 图标 -->
    <link rel="icon" type="image/png" sizes="32x32" href="{{ "/assets/images/favicon-32x32.png" | relative_url }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ "/assets/images/favicon-16x16.png" | relative_url }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ "/assets/images/apple-touch-icon.png" | relative_url }}">

    <!-- RSS订阅 -->
    <link rel="alternate" type="application/rss+xml" title="{{ site.title }} RSS Feed" href="{{ "/feed.xml" | absolute_url }}">

    <!-- 数学公式支持 -->
    {% if site.math.enable %}
    {% include mathjax.html %}
    {% endif %}

    <!-- 自定义头部脚本 -->
    <script>
        // 移动端适配辅助脚本
        (function() {
          const html = document.documentElement;
          function setRemUnit() {
            const rem = html.clientWidth / 10;
            html.style.fontSize = rem + 'px';
          }
          setRemUnit();
          window.addEventListener('resize', setRemUnit);
          window.addEventListener('orientationchange', setRemUnit);
        })();
    </script>

    <!-- 页面特定样式/脚本 -->
    {% if page.head_scripts %}
    {{ page.head_scripts }}
    {% endif %}
</head>
