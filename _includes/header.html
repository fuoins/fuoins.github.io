<header class="site-header">
  <div class="container header-inner">
    <a href="{{ '/' | relative_url }}" class="brand">
      <span class="brand-mark">{{ site.author.nickname | default: site.title }}</span>
      <span class="brand-name">{{ site.title }}</span>
    </a>

    <nav class="site-nav" id="siteNav">
      {% for item in site.nav %}
      <a href="{{ item.url | relative_url }}"
         class="nav-link{% if page.url == item.url %} active{% endif %}">
        {{ item.name }}
      </a>
      {% endfor %}
    </nav>

    <button class="nav-toggle" id="navToggle" aria-label="打开菜单" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
