{% if site.math.enable %}
<!-- 数学公式渲染 - 适配 GitHub Pages 环境 -->
<script type="text/javascript">
    {{ site.math.mathjax.config }}
</script>

<!-- 加载 MathJax 库 -->
<script type="text/javascript" id="MathJax-script" async
        src="{{ site.math.mathjax.src }}">
</script>

<!-- 公式换行样式 -->
<style>
    /* 数学公式自动换行核心样式 */
    .math-display {
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 0.5rem 0;
      margin: 1rem 0;
      -webkit-overflow-scrolling: touch;
    }

    mjx-container, .mjx-chtml {
      white-space: pre-wrap !important;
      word-break: break-all !important;
      max-width: 100% !important;
    }

    /* 移动端公式适配 */
    @media (max-width: 768px) {
      .math-display {
        padding: 0.3rem 0;
        margin: 0.8rem 0;
      }

      mjx-container {
        font-size: 0.9em !important;
      }
    }
</style>

<!-- 页面加载完成后处理公式容器 -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
      // 为所有块级公式添加自动换行容器
      setTimeout(function() {
        const mathElements = document.querySelectorAll('script[type^="math/tex"]');
        mathElements.forEach(el => {
          const display = el.type.includes('mode=display');
          if (display) {
            const wrapper = document.createElement('div');
            wrapper.className = 'math-display';
            el.parentNode.insertBefore(wrapper, el);
            wrapper.appendChild(el);
          }
        });

        // 监听窗口大小变化
        window.addEventListener('resize', function() {
          if (window.MathJax) {
            MathJax.typeset();
          }
        });
      }, 500);
    });
</script>
{% endif %}
