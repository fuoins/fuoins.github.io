<!DOCTYPE html>
<html>
<head>
<!-- 简化版MathJax配置：确保公式正常渲染，适配所有浏览器 -->
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script" async></script>
<script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']], // 行内公式标识（必须用单引号）
        displayMath: [['$$', '$$'], ['\\[', '\\]']], // 块级公式标识
        processEscapes: true, // 支持转义字符（\$ 显示普通$）
        autoload: {
          color: [],
          colorv2: ['color']
        }
      },
      chtml: {
        scale: 1.05, // 公式缩放（适配页面字体）
        displayAlign: 'left', // 块级公式左对齐
        displayIndent: '2em',
        linebreaks: {
          automatic: true, // 开启自动换行（核心修复）
          width: '90%' // 换行宽度阈值（适配移动端）
        }
      },
      startup: {
        pageReady: function() {
          return MathJax.startup.defaultPageReady().then(function() {
            // 公式渲染完成后，为容器添加自适应样式
            const mathElements = document.querySelectorAll('mjx-container');
            mathElements.forEach(el => {
              el.style.maxWidth = '100%';
              el.style.overflowX = 'auto';
              el.style.margin = '1rem 0';
            });
          });
        }
      },
      options: {
        enableMenu: false, // 关闭右键菜单（简化）
        ignoreHtmlClass: 'tex2jax_ignore',
        processHtmlClass: 'tex2jax_process'
      }
    };
</script>
<!-- 强制公式容器适配样式（解决换行/截断问题） -->
<style>
    /* 全局容器基础样式（确保不超出视口） */
    body {
      margin: 0;
      padding: 0 1rem;
      box-sizing: border-box;
    }
    /* 块级公式容器（强化移动端换行） */
    mjx-container[jax="CHTML"][display="true"] {
      display: block !important;
      overflow-x: auto !important;
      white-space: pre-wrap !important; /* 强制支持换行 */
      word-wrap: break-word !important;
      max-width: 100% !important;
      margin: 1.5rem 0 !important;
      padding: 0.5rem !important;
      box-sizing: border-box !important;
    }
    /* 行内公式容器 */
    mjx-container[jax="CHTML"][display="false"] {
      vertical-align: middle !important;
      font-size: 1.05em !important;
      white-space: normal !important;
    }
    /* 修复移动端公式溢出（细化适配） */
    @media (max-width: 768px) {
      mjx-container {
        font-size: 0.95em !important;
        max-width: calc(100% - 2rem) !important; /* 减去页面内边距 */
      }
      /* 块级公式移动端缩进调整 */
      mjx-container[jax="CHTML"][display="true"] {
        displayIndent: '1em' !important;
      }
    }
</style>
</head>
<body>
<!-- 你的页面内容 -->
</body>
</html>
