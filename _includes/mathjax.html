<!DOCTYPE html>
<html>
<head>
<!-- MathJax核心配置（适配现有全局CSS） -->
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script" async></script>
<script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        autoload: { color: [], colorv2: ['color'] }
      },
      chtml: {
        scale: 1.02,
        displayAlign: 'left',
        displayIndent: '1em',
        linebreaks: {
          automatic: true,
          width: 'calc(100% - 2rem)', // 适配body内边距，不超父容器
          linebreakAtWhitespace: true
        }
      },
      startup: {
        pageReady: function() {
          return MathJax.startup.defaultPageReady().then(function() {
            const mathElements = document.querySelectorAll('mjx-container');
            mathElements.forEach(el => {
              el.style.maxWidth = '100%';
              el.style.overflowX = 'hidden'; // 禁止横向滚动
              el.style.overflowY = 'visible';
              el.style.margin = '1.5rem 0';
              el.offsetHeight; // 触发重绘
            });
          });
        }
      },
      options: {
        enableMenu: false,
        ignoreHtmlClass: 'tex2jax_ignore',
        processHtmlClass: 'tex2jax_process'
      }
    };
</script>
<style>
    /* 块级公式：强制换行+不撑宽页面（高优先级适配） */
    .page-content mjx-container[jax="CHTML"][display="true"],
    .post-content mjx-container[jax="CHTML"][display="true"] {
      display: block !important;
      max-width: calc(100% - 2rem) !important; /* 匹配现有页面内边距 */
      width: 100% !important;
      overflow-x: hidden !important;
      overflow-y: visible !important;
      white-space: pre-wrap !important;
      word-wrap: break-word !important;
      word-break: break-all !important;
      margin: 1.5rem 0 !important;
      padding: 0.5rem !important;
      box-sizing: border-box !important;
    }

    /* 公式内部元素：继承换行样式，避免局部溢出 */
    mjx-container[jax="CHTML"] mjx-math,
    mjx-container[jax="CHTML"] mjx-row {
      white-space: pre-wrap !important;
      word-wrap: break-word !important;
      word-break: break-all !important;
      max-width: 100% !important;
      box-sizing: border-box !important;
    }

    /* 行内公式：适配文本流，不撑破行 */
    .page-content mjx-container[jax="CHTML"][display="false"],
    .post-content mjx-container[jax="CHTML"][display="false"] {
      vertical-align: middle !important;
      font-size: 1em !important;
      white-space: normal !important;
      max-width: calc(100% - 1rem) !important;
      box-sizing: border-box !important;
    }

    /* 移动端专项适配（匹配现有响应式规则） */
    @media (max-width: 768px) {
      .page-content mjx-container[jax="CHTML"][display="true"],
      .post-content mjx-container[jax="CHTML"][display="true"] {
        max-width: calc(100% - 1.6rem) !important; /* 匹配body移动端内边距 */
        displayIndent: 0 !important;
        padding: 0.3rem !important;
        font-size: 0.88em !important;
      }

      mjx-container {
        font-size: 0.9em !important;
      }
    }
</style>
</head>
<body>
<!-- 你的页面内容（公式会自动适配.page-content/.post-content容器） -->
</body>
</html>
