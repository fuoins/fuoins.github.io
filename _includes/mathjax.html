<!-- 使用 MathJax 4.x beta（目前最新穩定支援 scroll/linebreak 的版本） -->
<script src="https://cdn.jsdelivr.net/npm/mathjax@4.0.0-beta.5/es5/tex-mml-chtml.js" id="MathJax-script" async></script>

<script>
    window.MathJax = {
      tex: {
        inlineMath: [['\( ', ' \)'], ['\\(', '\\)']],
        displayMath: [['\[ ', ' \]'], ['\\[', '\\]']],
        processEscapes: true,
        autoload: {
          color: [],
          colorv2: ['color']
        }
      },
      chtml: {
        scale: 1.05,                  // 整體略放大一點，清晰度好
        displayAlign: 'left',
        displayIndent: '2em',
        displayOverflow: 'scroll'     // 關鍵！手機上強制出現水平滾動條（也可試 'linebreak' 但斷行不一定完美）
      },
      startup: {
        pageReady: function() {
          return MathJax.startup.defaultPageReady().then(function() {
            // 渲染完後再加強容器（保險）
            const mathContainers = document.querySelectorAll('mjx-container[jax="CHTML"][display="true"]');
            mathContainers.forEach(el => {
              el.style.maxWidth = '100%';
              el.style.width = '100%';                    // 強制佔滿寬度
              el.style.overflowX = 'auto';
              el.style.overflowY = 'hidden';
              el.style.WebkitOverflowScrolling = 'touch'; // iOS 滑動更順
              el.style.margin = '1.5rem 0';
              el.style.padding = '0.5rem 0';
            });
          });
        }
      },
      options: {
        enableMenu: false,
        ignoreHtmlClass: 'tex2jax_ignore',
        processHtmlClass: 'tex2jax_process'
      }
    };
</script>

<!-- 加強 CSS：針對手機 + 覆蓋 MathJax 內部行為 -->
<style>
    /* 塊級公式（display math） */
    mjx-container[jax="CHTML"][display="true"] {
      display: block !important;
      max-width: 100% !important;
      width: 100% !important;
      overflow-x: auto !important;
      overflow-y: hidden !important;
      -webkit-overflow-scrolling: touch !important;
      margin: 1.5rem 0 !important;
      padding: 0.5rem 0 !important;
      box-sizing: border-box !important;
    }

    /* 防止內層 mjx-math 被壓縮 */
    mjx-container[jax="CHTML"][display="true"] mjx-math {
      display: inline-block !important;
      min-width: 100% !important;
      white-space: nowrap !important;   /* 保持公式不自動斷，但允許容器滾動 */
    }

    /* 行內公式微調 */
    mjx-container[jax="CHTML"][display="false"] {
      vertical-align: middle !important;
      font-size: 1.05em !important;
    }

    /* 手機小螢幕再縮一點，避免太擠 */
    @media (max-width: 768px) {
      mjx-container {
        font-size: 0.95em !important;
      }
    }

    /* 如果你想把公式包在 div 裡更保險，可選用 */
    .math-scroll-wrapper {
      max-width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 1rem 0;
    }
</style>
