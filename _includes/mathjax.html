<!-- MathJax v3 配置（支持自动换行+移动端适配） -->
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],  // 行内公式标识
      displayMath: [['$$', '$$'], ['\\[', '\\]']], // 块级公式标识
      processEscapes: true,  // 支持转义$
      autoload: {
        color: [],
        colorv2: ['color']
      },
      packages: {'[+]': ['noerrors']}
    },
    svg: {
      fontCache: 'global',
      scale: 1,
      displayAlign: 'center',
      overflow: 'linebreak'  // 公式超出宽度自动换行
    },
    options: {
      renderActions: {
        findScript: [10, doc => {
          document.querySelectorAll('script[type^="math/tex"]').forEach(node => {
            const display = !!node.type.match(/; *mode=display/);
            const math = new Option().text + node.textContent;
            const text = document.createTextNode(display ? `$$${math}$$` : `$${math}$$`);
            node.parentNode.replaceChild(text, node);
          });
        }, '', false],
        renderDocument: [200, () => MathJax.startup.document.render(), '', false]
      }
    },
    startup: {
      pageReady() {
        return MathJax.startup.defaultPageReady().then(() => {
          // 公式渲染后适配移动端宽度
          document.querySelectorAll('.MJX-TEX').forEach(el => {
            el.style.maxWidth = '100%';
            el.style.overflowX = 'auto';
          });
        });
      }
    }
  };
</script>
<!-- MathJax 核心脚本 -->
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
