<footer class="site-footer">
  <div class="container">
    <div class="footer-content">
      <div class="footer-info">
        <h3>{{ site.title }}</h3>
        <p>{{ site.description }}</p>
        <p class="copyright">© {{ "now" | date: "%Y" }} {{ site.github_username }}. All rights reserved.</p>
      </div>
      <div class="footer-links">
        <a href="https://github.com/{{ site.github_username }}" target="_blank" class="footer-link">GitHub</a>
        <a href="mailto:{{ site.email }}" class="footer-link">邮箱</a>
        <a href="{{ "/" | relative_url }}" class="footer-link">首页</a>
      </div>
    </div>
    <div class="footer-bottom">
      <p>Built with <a href="https://jekyllrb.com" target="_blank">Jekyll</a> & hosted on <a href="https://pages.github.com" target="_blank">GitHub Pages</a></p>
    </div>
  </div>
</footer>

<!-- 辅助脚本 -->
<script src="{{ "/assets/js/main.js" | relative_url }}"></script>
