<footer class="site-footer">
    <div class="container">
        <div class="footer-content">
            <div class="footer-brand">
                <h3>{{ site.title }}</h3>
                <p>{{ site.description }}</p>
            </div>

            <div class="footer-links">
                <div class="link-group">
                    <h4>快速链接</h4>
                    <ul>
                        <li><a href="{{ "/" | relative_url }}">首页</a></li>
                        <li><a href="{{ "/about" | relative_url }}">关于</a></li>
                        <li><a href="{{ "/posts" | relative_url }}">文章归档</a></li>
                    </ul>
                </div>

                <div class="link-group">
                    <h4>联系方式</h4>
                    <ul>
                        <li><a href="mailto:{{ site.email }}"><i class="fas fa-envelope"></i> {{ site.email }}</a></li>
                        <li><a href="https://github.com/{{ site.github_username }}" target="_blank"><i class="fab fa-github"></i> @{{ site.github_username }}</a></li>
                        <li><a href="https://twitter.com/{{ site.twitter_username }}" target="_blank"><i class="fab fa-twitter"></i> @{{ site.twitter_username }}</a></li>
                    </ul>
                </div>
            </div>

            <div class="footer-copyright">
                <p>&copy; {{ "now" | date: "%Y" }} {{ site.title }}. All rights reserved.</p>
                <p>Built with <i class="fas fa-heart" style="color: #e25555;"></i> using Jekyll & GitHub Pages</p>
            </div>
        </div>
    </div>
</footer>

<!-- 回到顶部按钮 -->
<button id="back-to-top" class="back-to-top" aria-label="Back to top">
    <i class="fas fa-arrow-up"></i>
</button>

<!-- 主脚本 -->
<script src="{{ "/assets/js/main.js" | relative_url }}"></script>
