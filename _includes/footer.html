<footer class="site-footer">
    <div class="container">
        <div class="site-footer__inner">
            <!-- 博客信息 -->
            <div class="site-footer__info">
                <h3 class="site-footer__title">{{ site.title }}</h3>
                <p class="site-footer__description">{{ site.description }}</p>
                <p class="site-footer__copyright">
                    &copy; {{ "now" | date: "%Y" }} {{ site.title }}. All rights reserved.
                </p>
            </div>

            <!-- 社交链接 -->
            <div class="site-footer__social">
                <h4 class="site-footer__social-title">社交链接</h4>
                <ul class="site-footer__social-list">
                    <li class="site-footer__social-item">
                        <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
                            GitHub
                        </a>
                    </li>
                    <li class="site-footer__social-item">
                        <a href="https://twitter.com/{{ site.twitter_username }}" target="_blank" rel="noopener noreferrer" aria-label="Twitter">
                            Twitter
                        </a>
                    </li>
                    <li class="site-footer__social-item">
                        <a href="mailto:{{ site.email }}" aria-label="Email">
                            Email
                        </a>
                    </li>
                </ul>
            </div>

            <!-- 快速导航 -->
            <div class="site-footer__nav">
                <h4 class="site-footer__nav-title">快速导航</h4>
                <ul class="site-footer__nav-list">
                    {% for item in site.nav %}
                    <li class="site-footer__nav-item">
                        <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
                    </li>
                    {% endfor %}
                </ul>
            </div>
        </div>

        <!-- 底部额外信息 -->
        <div class="site-footer__bottom">
            <p class="site-footer__powered">
                Powered by <a href="https://jekyllrb.com/" target="_blank" rel="noopener noreferrer">Jekyll</a> | Hosted on <a href="https://pages.github.com/" target="_blank" rel="noopener noreferrer">GitHub Pages</a>
            </p>
            <p class="site-footer__math">
                Math support by <a href="https://www.mathjax.org/" target="_blank" rel="noopener noreferrer">MathJax</a>
            </p>
        </div>
    </div>
</footer>

<!-- 回到顶部按钮 -->
<button class="back-to-top" id="back-to-top" aria-label="回到顶部">
    ↑
</button>

<!-- 回到顶部脚本 -->
<script>
    (function() {
      const backToTopBtn = document.getElementById('back-to-top');

      // 滚动时显示/隐藏按钮
      window.addEventListener('scroll', function() {
        if (window.scrollY > 300) {
          backToTopBtn.classList.add('back-to-top--show');
        } else {
          backToTopBtn.classList.remove('back-to-top--show');
        }
      });

      // 点击回到顶部
      backToTopBtn.addEventListener('click', function() {
        window.scrollTo({
          top: 0,
          behavior: 'smooth'
        });
      });
    })();
</script>
