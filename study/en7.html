        .option.incorrect { color: #e74c3c; }

    <!-- 第一套题：答案dacbc -->

                {

                    o: [

                {
                    q: "What do we learn about consumers buying Beyond Burger and Impossible Foods products?",
                    o: [

                        "They are mostly animal-rights advocates.",

                    ],
                    ans: 0
                },
                {
                    q: "What can we conclude about Impossible Foods' products from Joan Solman's remark?",
                    o: [

                        "They very much resemble animal meat.",

                    ],
                    ans: 1
                },
                {
                    q: "Why can the habit of eating a plant-based diet lead to better health?",
                    o: [
                        "It frees people from any known link to cancer.",
                        "It provides all the nutrients for staying healthy.",
                        "It helps maintain normal blood pressure and blood sugar.",
                        "It reduces various health risks posed by meat consumption."

                {
                    q: "What does the author recommend we eat at the end of the passage?",
                    o: [

                        "New generations of alternate meat."

            ]
        };

        // 2. 打乱数组函数（简单可靠）
        function shuffle(arr) {
            for(let i=arr.length-1; i>0; i--) {
                const j = Math.floor(Math.random() * (i+1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // 3. 初始化显示所有题目
        for(let quizId in allQuizzes) {
            const container = document.getElementById(quizId);
            const quiz = allQuizzes[quizId];
            // 打乱题目顺序
            const shuffledQs = shuffle([...quiz]);
            
            shuffledQs.forEach((item, qIdx) => {
                // 创建题目容器
                const qDiv = document.createElement('div');
                qDiv.className = 'question-item';
                qDiv.setAttribute('data-ans', item.ans); // 存正确答案
                
                // 题目文本
                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.textContent = item.q;
                qDiv.appendChild(qText);
                
                // 打乱选项顺序
                const shuffledOps = shuffle([...item.o]);
                shuffledOps.forEach((op, oIdx) => {
                    const opDiv = document.createElement('div');
                    opDiv.className = 'option';
                    opDiv.textContent = op;
                    // 存选项原始索引（用于匹配答案）
                    opDiv.setAttribute('data-orig', item.o.indexOf(op));
                    qDiv.appendChild(opDiv);
                });
                
                container.appendChild(qDiv);
            });
        }

        // 4. 显示正确答案函数
        function showAns(quizId) {
            const container = document.getElementById(quizId);
            const questions = container.querySelectorAll('.question-item');
            
            questions.forEach(q => {
                const correctAns = parseInt(q.getAttribute('data-ans'));
                const options = q.querySelectorAll('.option');
                
                options.forEach(op => {
                    const origIdx = parseInt(op.getAttribute('data-orig'));
                    if(origIdx === correctAns) {
                        op.className = 'option correct';
                    } else {
                        op.className = 'option incorrect';
                    }
                });
            });
        }
    </script>
</body>
</html>
