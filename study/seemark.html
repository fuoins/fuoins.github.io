<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数学核心知识点解析 - Zy</title>
    <!-- 引入 marked 解析 Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- 引入 MathJax 渲染数学公式 -->
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            font-family: "Segoe UI", system-ui, sans-serif;
            line-height: 1.8;
            color: #333;
            background-color: #f8f9fa;
        }
        /* 头部元信息样式 */
        .header-meta {
            margin-bottom: 2rem;
            padding: 1.5rem;
            border-radius: 8px;
            background-color: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .header-meta h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: #2c3e50;
        }
        .header-meta .subtitle {
            color: #7f8c8d;
            margin-bottom: 1rem;
        }
        .header-meta .author {
            color: #34495e;
            font-weight: 500;
        }
        .header-meta .tags {
            margin-top: 0.8rem;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .header-meta .tag {
            padding: 0.2rem 0.6rem;
            background-color: #e3f2fd;
            color: #2196f3;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        /* Markdown 内容样式 */
        .markdown-content {
            padding: 2rem;
            border-radius: 8px;
            background-color: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .markdown-content h2 {
            font-size: 1.5rem;
            margin: 1.5rem 0 1rem;
            color: #2c3e50;
            border-left: 4px solid #2196f3;
            padding-left: 0.8rem;
        }
        .markdown-content h3 {
            font-size: 1.2rem;
            margin: 1.2rem 0 0.8rem;
            color: #34495e;
        }
        .markdown-content ul {
            margin-left: 1.8rem;
            margin-bottom: 1rem;
        }
        .markdown-content pre {
            background-color: #f5f5f5;
            padding: 1rem;
            border-radius: 4px;
            overflow-x: auto;
            margin: 1rem 0;
        }
        .markdown-content code {
            background-color: #f5f5f5;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-size: 0.95rem;
        }
        .markdown-content pre code {
            background-color: transparent;
            padding: 0;
        }
        /* 数学公式间距优化 */
        mjx-container {
            margin: 0.3rem 0;
        }
    </style>
</head>
<body>
    <!-- 头部元信息展示区 -->
    <div class="header-meta" id="headerMeta"></div>
    <!-- Markdown 内容渲染区 -->
    <div class="markdown-content" id="markdownContent"></div>

    <script>
        // 1. 配置 marked 支持 GFM 和换行
        marked.setOptions({
            gfm: true,
            breaks: true,
            headerIds: false,
            mangle: false
        });

        // 2. 自定义渲染器：确保 MathJax 能识别公式
        const renderer = new marked.Renderer();
        // 处理行内公式 $...$
        renderer.text = (text) => {
            return text.replace(/\$(.*?)\$/g, '\\($1\\)');
        };
        // 处理块级公式 $$...$$
        renderer.code = (code, language) => {
            if (language === 'math') {
                return `\\[${code}\\]`;
            }
            return `<pre><code>${code}</code></pre>`;
        };
        marked.use({ renderer });

        // 3. 解析 Jekyll 头部元信息 (--- 包裹的部分)
        function parseJekyllFrontMatter(markdownText) {
            const frontMatterRegex = /^---\n([\s\S]*?)\n---/;
            const match = markdownText.match(frontMatterRegex);
            if (!match) return { content: markdownText };
            
            const frontMatter = match[1];
            const content = markdownText.replace(frontMatterRegex, '').trim();
            const meta = {};

            // 解析键值对 (支持简单的字符串、数组)
            frontMatter.split('\n').forEach(line => {
                const [key, value] = line.split(':').map(item => item.trim());
                if (!key || !value) return;
                // 处理数组 (如 tags)
                if (value.startsWith('-')) {
                    meta[key] = frontMatter
                        .split(new RegExp(`^${key}:`))[1]
                        .split('\n')
                        .filter(item => item.trim().startsWith('-'))
                        .map(item => item.trim().replace('-', '').trim());
                } else {
                    meta[key] = value.replace(/"/g, '');
                }
            });
            return { meta, content };
        }

        // 4. 加载并渲染 Markdown 文件
        async function loadAndRenderMarkdown() {
            try {
                // 读取同目录的 math-notes.md 文件
                const response = await fetch('math-notes.md');
                if (!response.ok) throw new Error('无法加载 Markdown 文件');
                
                const markdownText = await response.text();
                const { meta, content } = parseJekyllFrontMatter(markdownText);

                // 渲染头部元信息
                const headerMetaEl = document.getElementById('headerMeta');
                headerMetaEl.innerHTML = `
                    <h1>${meta.title || '无标题'}</h1>
                    <div class="subtitle">${meta.subtitle || ''}</div>
                    <div class="author">作者: ${meta.author || '未知'}</div>
                    ${meta.tags ? `
                        <div class="tags">
                            ${meta.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                        </div>
                    ` : ''}
                `;

                // 渲染 Markdown 内容并触发 MathJax 渲染
                const markdownContentEl = document.getElementById('markdownContent');
                markdownContentEl.innerHTML = marked.parse(content);
                MathJax.typesetPromise([markdownContentEl]);

            } catch (error) {
                document.getElementById('markdownContent').innerHTML = `<p style="color: red;">加载失败: ${error.message}</p>`;
            }
        }

        // 页面加载后执行
        window.onload = loadAndRenderMarkdown;
    </script>
</body>
</html>
