                <!-- 1. 郭艳东教授 -->
                <li>
                    <figure>
                        <div class="mask">
                            <p>郭艳东，女，1981年10月生，满族，博士，教授，硕士生导师，现为数学科学学院副院长。辽宁省教学名师，“兴辽计划”青年拔尖人才，辽宁省百千万人才“万人”层次，国家自然科学基金委评审专家，辽宁省产业（创业）投资引导基金评审专家，锦州市优秀科技工作者，锦州市学术带头人。近年来致力于过程模拟与优化、算法设计分析、离子液体的多尺度模拟与优化关键技术的研究。主持参与省部级以上项目22项，其中包括国家自然科学基金项目3项，辽宁省自然科学基金7项，辽宁省教育厅项目10项等。在《Computers & Industrial Engineering》《Computer Systems Science and Engineering》《中国科学》《自动化学报》等学术期刊发表SCI、EI检索论文10余篇，专著1部，发明专利5项。获得省级教学成果奖3项，多次获得辽宁省自然科学学术成果和锦州市自然科学学术成果奖。</p>
                        </div>

                    </figure>

                        </h3>
                    </figcaption>
                </li>
                <!-- 2. 白凤翎教授 -->
                <li>
                    <figure>
                        <div class="mask">
                            <p>白凤翎教授，2022年度辽宁省教学名师，辽宁省水产食品安全专业委员会副主任委员、辽宁省水产学会水产品加工专业委员会委员、辽宁省食品科学技术学会常务理事，辽宁省水产学会理事、中国食品科学技术学会乳酸菌分会理事、酿造分会理事，中国农业工程学会农产品加工及贮藏工程分会理事。兼任《乳品科学与技术》编委，教育部学位中心研究生论文评议专家，《食品科学》《水产科学》《食品工业科技》等期刊审稿人，主要从事食品质量与安全控制，乳酸菌资源开发与利用等方面研究。先后主持或参与国家自然科学基金、科技部、辽宁省科技厅等科研项目12项，发表学术论文130余篇，其中SCI/EI论文40多篇。主持省一流课程1门，校级精品课、示范课、案例课等3门。编写教材3部，获辽宁省教学成果奖1项。主讲课程：食品安全学、现代食品微生物学、食品安全案例。</p>
                        </div>

    <script>
        var thumbs = jQuery('#thumbnails').slippry({
            slippryWrapper: '<div class="slippry_box thumbnails" />',

            auto: false,
            onSlideBefore: function(el, index_old, index_new) {
                jQuery('.thumbs a img').removeClass('active');
                jQuery('img', jQuery('.thumbs a')[index_new]).addClass('active');
            }
        });

        jQuery('.thumbs a').click(function() {
            thumbs.goToSlide($(this).data('slide'));
            return false;
        });
        
        // 可选：添加链接点击的提示效果

                    alert(`即将跳转到${this.textContent}的详细页面`);
                }
            });
        });
