            <h3>
                <span>渤海大学 </span><b>ACHIEVEMENTS</b><b style="padding-right: 5px;">学科</b><span>科研成果展示</span>
            </h3>
            <br>
        </div>
        <div class="box">
            <ul>
                <li>
                    <figure>
                        <div class="mask">
                            <p>教育学为辽宁省重点学科，拥有教育学一级学科硕士学位授权点，涵盖学前教育、高等教育、课程与教学论等多个研究方向。学科团队长期聚焦基础教育改革、教师专业发展等领域研究，承担国家级、省部级课题30余项，发表核心期刊论文200余篇，出版专著教材50余部，多项成果获辽宁省哲学社会科学优秀成果奖，为区域教育高质量发展提供重要支撑。</p>
                        </div>
                        <img src="img/ww1.jpg" />
                    </figure>
                    <figcaption>
                        <h3>教育学（省级重点学科）</h3>
                    </figcaption>
                </li>
                <li>
                    <figure>
                        <div class="mask">
                            <p>中国语言文学为辽宁省重点学科，拥有一级学科硕士学位授权点，下设古代文学、现当代文学、语言学及应用语言学等方向。学科在辽金文学研究、东北方言研究等领域形成鲜明特色，主持国家社会科学基金项目15项，省部级项目40余项，在《文学评论》《中国语文》等权威期刊发表论文100余篇，研究成果获多项省级奖励，学术影响力位居省内高校前列。</p>
                        </div>
                        <img src="img/ww2.jpg" />
                    </figure>
                    <figcaption>
                        <h3>中国语言文学（省级重点学科）</h3>
                    </figcaption>
                </li>
                <li>
                    <figure>
                        <div class="mask">
                            <p>数学为辽宁省重点学科，拥有一级学科硕士学位授权点，主要研究方向包括代数学、几何学、概率论与数理统计、应用数学等。学科团队在组合数学、微分方程数值解法等领域成果显著，承担国家自然科学基金项目20项，省部级项目35项，发表SCI/EI检索论文180余篇，部分成果被国际同行广泛引用，应用于工程计算、数据分析等实际领域。</p>
                        </div>
                        <img src="img/ww3.jpg" />
                    </figure>
                    <figcaption>
                        <h3>数学（省级重点学科）</h3>
                    </figcaption>
                </li>
                <li>
                    <figure>
                        <div class="mask">
                            <p>计算机科学与技术为校级优势特色学科，拥有一级学科硕士学位授权点，聚焦人工智能、大数据处理、网络安全等前沿领域。学科建有辽宁省人工智能应用技术重点实验室，承担国家级科研项目12项，与华为、东软等企业共建产学研合作基地，研发的智能数据分析系统、工业物联网安全平台等技术成果成功转化，获辽宁省科技进步三等奖2项。</p>
                        </div>
                        <img src="img/ww4.jpg" />
                    </figure>
                    <figcaption>
                        <h3>计算机科学与技术（优势特色学科）</h3>
                    </figcaption>
                </li>
                <li>
                    <figure>
                        <div class="mask">
                            <p>食品科学与工程为校级优势特色学科，拥有专业硕士学位授权点，依托辽宁省食品安全重点实验室，聚焦农产品深加工、功能性食品研发等方向。学科团队研发的果蔬保鲜技术、杂粮深加工工艺等获国家发明专利15项，主持省部级科研项目28项，与辽宁当地食品企业合作开发新产品30余种，技术成果转化率达40%，获辽宁省技术发明奖1项。</p>
                        </div>
                        <img src="img/ww5.jpg" />
                    </figure>
                    <figcaption>
                        <h3>食品科学与工程（优势特色学科）</h3>
                    </figcaption>
                </li>
                <li>
                    <figure>
                        <div class="mask">
                            <p>工商管理为校级优势特色学科，拥有专业硕士学位授权点（MBA），下设企业管理、市场营销、会计学等研究方向。学科紧密结合辽西地区产业发展需求，研究成果涵盖中小企业管理创新、区域品牌建设等领域，主持国家社会科学基金项目8项，省部级项目25项，出版专著12部，为地方政府和企业提供决策咨询报告50余份，获辽宁省哲学社会科学优秀成果奖3项。</p>
                        </div>
                        <img src="img/ww6.jpg" />
                    </figure>
                    <figcaption>
                        <h3>工商管理（优势特色学科）</h3>
                    </figcaption>
                </li>
                <li>
                    <figure>
                        <div class="mask">
                            <p>物理学为校级重点学科，拥有一级学科硕士学位授权点，主要研究方向包括凝聚态物理、光学、粒子物理与原子核物理等。学科建有辽宁省光电功能材料重点实验室，承担国家自然科学基金项目9项，省部级项目18项，在低维材料制备、激光技术应用等领域发表SCI检索论文120余篇，研发的新型光电探测器已应用于环境监测、医疗设备等领域。</p>
                        </div>
                        <img src="img/ww7.jpg" />
                    </figure>
                    <figcaption>
                        <h3>物理学（校级重点学科）</h3>
                    </figcaption>
                </li>
                <li>
                    <figure>
                        <div class="mask">
                            <p>马克思主义理论为校级重点学科，拥有一级学科硕士学位授权点，涵盖马克思主义基本原理、思想政治教育、中国近现代史基本问题研究等方向。学科团队聚焦新时代思想政治教育创新、东北红色文化传承等领域，主持国家社会科学基金项目6项，省部级项目22项，发表核心期刊论文90余篇，编写思想政治理论课教材8部，获辽宁省教学成果奖2项。</p>
                        </div>
                        <img src="img/ww8.jpg" />
                    </figure>
                    <figcaption>
                        <h3>马克思主义理论（校级重点学科）</h3>
                    </figcaption>
                </li>
            </ul>
