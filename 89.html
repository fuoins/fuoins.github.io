<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片加载测试</title>
    <!-- 仅保留必要元标签，减少头部加载压力 -->
</head>
<body style="margin: 0; padding: 1rem;">
    <!-- 原生懒加载+最大宽度适配，兼顾速度与显示效果 -->
    <img 
        src="https://free.picui.cn/free/2025/12/14/693ed90eca7d8.png" 
        alt="测试图片" 
        loading="lazy" 
        style="max-width: 100%; height: auto;"
    >
</body>
</html>
