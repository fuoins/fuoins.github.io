<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>感谢捐赠</title>
    <style>
        :root {
            --primary: #ff6b35;
            --primary-soft: #ffd6a5;
            --text: #333;
            --muted: #777;
            --card-radius: 36px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #fff3e0;
            background: linear-gradient(135deg, #fff3e0, #ffe0c0, #ffd6a5, #ffc9b0);
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            width: 320px;
            height: 320px;
            background: #ff9f1c;
            top: -80px;
            right: -50px;
        }

        body::after {
            width: 280px;
            height: 280px;
            background: #ff6b6b;
            bottom: -100px;
            left: -30px;
        }

        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 840px;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            border-radius: var(--card-radius);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 24px 80px rgba(255, 106, 0, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.6);
            padding: clamp(28px, 6vw, 56px);
            text-align: center;
            animation: cardIn 0.9s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(32px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .heart-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 88px;
            height: 88px;
            margin-bottom: 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffe0c0, #ffd6a5);
            box-shadow: 0 12px 32px rgba(255, 120, 60, 0.22);
            animation: floatHeart 3s ease-in-out infinite;
        }

        .heart {
            font-size: 40px;
            display: inline-block;
            animation: heartBeat 2s ease-in-out infinite;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            10% { transform: scale(1.12) rotate(-4deg); }
            20% { transform: scale(1); }
            30% { transform: scale(1.08) rotate(4deg); }
            40% { transform: scale(1); }
        }

        @keyframes floatHeart {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        h1 {
            font-size: clamp(28px, 6vw, 38px);
            font-weight: 800;
            letter-spacing: 2px;
            line-height: 1.3;
            background: linear-gradient(90deg, #e8590c, #ff922b, #f76707, #e8590c);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradientMove 6s linear infinite;
        }

        @keyframes gradientMove {
            to { background-position: 300% 0; }
        }

        .subtitle {
            margin-top: 12px;
            color: #c05a1e;
            font-size: 16px;
            letter-spacing: 1px;
            font-weight: 500;
        }

        .divider {
            width: 68px;
            height: 4px;
            margin: 20px auto;
            border-radius: 99px;
            background: linear-gradient(90deg, #ffa94d, #ff6b35);
        }

        .message {
            max-width: 560px;
            margin: 0 auto;
            padding: 20px 24px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.03);
            color: #555;
            font-size: 15px;
            line-height: 2;
            letter-spacing: 0.4px;
        }

        .message strong {
            display: block;
            font-size: 17px;
            color: #d9480f;
            margin-bottom: 4px;
        }

        .message span {
            display: block;
        }

        .divider-text {
            width: 30px;
            height: 2px;
            background: #ffd6a5;
            margin: 10px auto;
            border-radius: 2px;
        }

        .sections {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
            margin-top: 36px;
        }

        .qr-card {
            border-radius: 28px;
            padding: 24px 20px 20px;
            background: rgba(255, 255, 255, 0.62);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 24px rgba(255, 120, 60, 0.08);
            transition: transform 0.35s cubic-bezier(0.23, 1, 0.32, 1), box-shadow 0.35s ease;
        }

        .qr-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 40px rgba(255, 120, 60, 0.16);
        }

        .qr-card.wx {
            background: rgba(238, 247, 255, 0.62);
            border-color: rgba(208, 235, 255, 0.8);
            box-shadow: 0 8px 24px rgba(80, 160, 255, 0.08);
        }

        .qr-card.wx:hover {
            box-shadow: 0 16px 40px rgba(80, 160, 255, 0.16);
        }

        .qr-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 700;
            color: #495057;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }

        .qr-title .icon {
            font-size: 20px;
        }

        .qr-img {
            display: block;
            width: 100%;
            max-width: 240px;
            aspect-ratio: 1;
            object-fit: cover;
            margin: 0 auto;
            border-radius: 20px;
            background: #fff8f2;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1), box-shadow 0.5s ease;
        }

        .qr-card.wx .qr-img {
            background: #f0f7ff;
        }

        .qr-img:hover {
            transform: scale(1.04) rotate(-1deg);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.1);
        }

        .qr-tip {
            display: inline-block;
            margin-top: 16px;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 13px;
            letter-spacing: 1px;
            font-weight: 500;
            background: #ffecdb;
            color: #e8590c;
        }

        .qr-card.wx .qr-tip {
            background: #e7f5ff;
            color: #1971c2;
        }

        .footer-text {
            margin-top: 36px;
            font-size: 14px;
            color: #adb5bd;
            letter-spacing: 1px;
            line-height: 1.8;
        }

        .footer-text .heart-small {
            color: #ff6b35;
            display: inline-block;
            animation: heartBeat 2s ease-in-out infinite;
        }

        ::selection {
            background: #ffd6a5;
            color: #333;
        }

        @media (min-width: 680px) {
            .sections {
                grid-template-columns: 1fr 1fr;
                gap: 32px;
            }

            .card {
                padding: 56px 50px 48px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="heart-wrapper">
            <span class="heart">❤️</span>
        </div>

        <h1>感谢您的捐赠</h1>
        <p class="subtitle">每一份善意都值得被郑重感谢</p>

        <div class="divider"></div>

        <div class="message">
            <strong>每一份善意都会被铭记</strong>
            <span>衷心感谢您的支持与信任</span>
            <div class="divider-text"></div>
            <span>您的每一笔捐赠都将用于有价值的事业</span>
            <span>祝您生活愉快，万事顺遂</span>
        </div>

        <div class="sections">
            <div class="qr-card">
                <div class="qr-title">
                    <span class="icon">💝</span>
                    捐赠收款码
                </div>
                <img class="qr-img" src="juanzeng.png" alt="微信收款二维码">
                <span class="qr-tip">微信扫描 即可捐赠</span>
            </div>

            <div class="qr-card wx">
                <div class="qr-title">
                    <span class="icon">👤</span>
                    作者微信
                </div>
                <img class="qr-img" src="weixin.png" alt="作者微信二维码">
                <span class="qr-tip">添加微信 交流心得</span>
            </div>
        </div>

        <p class="footer-text">
            感恩有你 · 一路同行 <span class="heart-small">❤</span>
        </p>
    </div>
</body>
</html>
