<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>词汇练习：中文→英文</title>
    <style>
        body { font-family: 微软雅黑, sans-serif; max-width: 800px; margin: 20px auto; padding: 0 20px; }
        .vocab-item { margin: 15px 0; padding: 10px; border-bottom: 1px dashed #ccc; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .vocab-item span:first-child { flex: 0 0 60px; text-align: right; }
        .vocab-item .chinese { flex: 1; min-width: 200px; }
        input { padding: 5px; width: 220px; flex: 0 0 220px; }
        button { padding: 8px 20px; border: none; border-radius: 4px; cursor: pointer; margin: 0 5px; }
        .check-btn { background: #2196F3; color: white; }
        .check-btn:hover { background: #1976D2; }
        .show-ans-btn { background: #4CAF50; color: white; }
        .show-ans-btn:hover { background: #45a049; }
        .reset-btn { background: #f44336; color: white; }
        .reset-btn:hover { background: #d32f2f; }
        .answer { margin-left: 10px; font-weight: bold; display: none; }
        .correct { color: #4CAF50; }
        .incorrect { color: #f44336; }
        .wrong-mark { color: #ff9800; margin-left: 5px; display: none; }
        .btn-group { margin: 20px 0; }
    </style>
</head>
<body>
    <h1>词汇练习：根据中文写英文</h1>
    <div id="vocab-container">
        <!-- 动态生成打乱的词汇题 -->
    </div>
    <div class="btn-group">
        <button class="check-btn" onclick="checkAnswers()">校验答案</button>
        <button class="show-ans-btn" onclick="showAnswers()">显示答案</button>
        <button class="reset-btn" onclick="resetExercise()">重新练习</button>
    </div>

    <script>
        // 整合后的词汇列表（去除人名、地点）
        const vocabList = {
            // 第一组图片词汇
            "真诚；真挚": "sincerity",
            "（书写、印刷或计算机上的）字，字体，符号": "character",
            "显示；反映": "reflect",
            "品德；品性": "quality",
            "（某种观念或特征的）代表，标志物": "symbol",
            "诚实；正直": "integrity",
            "坚决；坚定": "resolution",
            "谦虚；谦逊": "modesty",
            "植根于；来源于": "be rooted in",
            "后代；后裔": "descendant",
            "追溯": "trace sth. back to",
            "祖先；祖宗": "ancestor",
            "财富": "fortune",
            "长袍；袍服": "robe",
            // 第二组图片词汇
            "杰作；名作；代表作": "masterpiece",
            "西班牙的；西班牙人的；西班牙语的": "Spanish",
            "取决于": "depend upon / on",
            "接收": "pick up",
            "（图片或照片的）前景": "foreground",
            "途径；渠道": "channel",
            "意大利的；意大利人的；意大利语的": "Italian",
            "大师；能手": "master",
            "打算；计划；想要": "intend",
            "使困惑；把（某人）弄糊涂": "confuse",
            "不断移动的；不断变化的；动态的": "dynamic",
            "表情；神色": "expression",
            "庆祝；祝贺；颂扬": "celebration",
            "文艺复兴时期的": "Renaissance",
            "历史学家；史学工作者": "historian",
            "神秘的；神奇的；不可思议的": "mystic",
            "万古长新的；永不过时的": "timeless",
            "建立；设立": "establish",
            "使命；天职": "mission",
            "机构；团体": "institution",
            "家具": "furniture",
            "（印刷用的）字体": "typeface",
            "（供一人用的）一副餐具": "setting",
            "关注；注意": "focus on",
            "原则；原理；基本的观念": "principle",
            "车库；停车房": "garage",
            "排印；版面设计": "typography",
            // 第三组图片词汇
            "会议": "conference",
            "住所；寓所": "quarters",
            "建筑师": "architect",
            "本质上；实际上": "at heart",
            "爱情；恋爱": "romance",
            "（高中或四年制大学的）三年级学生": "junior",
            "学分": "credit",
            "记录；登记": "register",
            "情绪（上）的；情感（上）的": "emotional",
            "内容；信息": "stuff",
            "使大为惊讶": "blow away",
            "彻底地；全面地；详尽地": "thoroughly",
            "前任的；曾经的": "former",
            "女（性）的": "female",
            "（经过考虑后）认为，以为": "figure",
            "文学；文学作品": "literature",
            "退休的": "retired",
            "公寓套房": "apartment",
            "（机件或人体器官）失灵，丧失功能": "fail",
            "给（某人）当家庭教师；指导": "tutor",
            "智慧；才智": "wisdom",
            "有深刻了解的；富有洞察力的": "insightful",
            "（使）引起重视；唤起注意": "wake up",
            // 第四组图片词汇
            "科幻小说": "science fiction",
            "（计划、主意或物体）精巧的，巧妙的": "ingenious",
            "礼貌；礼仪": "manners",
            "渴望；热切": "eagerness",
            "超出（某个数量、水平或限度）": "beyond",
            "与……相比": "compared with",
            "总括起来意味着": "add up to",
            "（突然）出现": "turn up",
            "集中注意力；专注": "concentrate",
            "应该；应当": "ought to",
            "（身体或精神上）受苦，遭受（痛苦）": "suffer",
            "使愉快；使高兴": "delight",
            "可获得的；可用的": "available",
            "（某人）不幸的，倒霉的": "unfortunate",
            "不寻常的；奇特的；值得注意（赞扬）的": "remarkable",
            "存在；实际上有": "exist",
            "只存在（发生）于某人的想象之中": "in sb.'s imagination",
            "普通的；平常的": "ordinary",
            "异乎寻常的；令人惊奇的": "extraordinary",
            "珍视": "hold dear",
            "（艺术创作所用的）材料": "medium",
            "创造性；创造力": "creativity",
            "二维的；平面的": "two-dimensional",
            "雕像；雕刻品；雕塑作品": "sculpture",
            "用……办法；借助于": "by means of",
            "出现；呈现": "arise",
            "在……领域；在……方面": "in the field of",
            "归功于；多亏": "thanks to",
            "纯粹的；十足的": "sheer",
            "复杂的；难以理解的": "complex",
            "有趣的": "playful",
            "童年；儿童时代": "childhood",
            "矛盾；冲突": "conflict",
            "有点；有几分": "kind of",
            "精致的；精巧的；精美的": "delicate",
            "实际的；真实的": "actual",
            "和……有联系；和……相关联": "relate to"
        };

        // 初始化练习
        function initExercise() {
            const container = document.getElementById('vocab-container');
            container.innerHTML = ''; // 清空容器
            const shuffledKeys = Object.keys(vocabList).sort(() => Math.random() - 0.5);
            
            shuffledKeys.forEach((chinese, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'vocab-item';
                itemDiv.innerHTML = `
                    <span>${index + 1}.</span>
                    <span class="chinese">${chinese}</span>
                    <input type="text" placeholder="请输入英文" class="user-input">
                    <span class="answer" data-answer="${vocabList[chinese].toLowerCase()}"></span>
                    <span class="wrong-mark" style="display: none;">⚠️ 答案错误</span>
                `;
                container.appendChild(itemDiv);
            });
        }

        // 校验答案（忽略大小写）
        function checkAnswers() {
            const inputs = document.querySelectorAll('.user-input');
            const answers = document.querySelectorAll('.answer');
            const wrongMarks = document.querySelectorAll('.wrong-mark');
            
            inputs.forEach((input, index) => {
                const userAnswer = input.value.trim().toLowerCase();
                const correctAnswer = answers[index].getAttribute('data-answer');
                const isCorrect = userAnswer === correctAnswer;
                
                answers[index].style.display = 'inline';
                answers[index].textContent = correctAnswer;
                answers[index].className = isCorrect ? 'answer correct' : 'answer incorrect';
                wrongMarks[index].style.display = isCorrect ? 'none' : 'inline';
                input.disabled = true;
            });
        }

        // 显示所有答案
        function showAnswers() {
            const answers = document.querySelectorAll('.answer');
            answers.forEach(ans => {
                ans.textContent = ans.getAttribute('data-answer');
                ans.style.display = 'inline';
                ans.className = 'answer correct';
            });
            document.querySelectorAll('.user-input').forEach(input => input.disabled = true);
        }

        // 重置练习
        function resetExercise() {
            initExercise();
        }

        // 页面加载时初始化
        window.onload = initExercise;
    </script>
</body>
</html>
