<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>请在浏览器打开</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f5f5f5;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .tip-box {
            background: #fff;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            max-width: 320px;
        }
        h3 {
            color: #333;
            margin-bottom: 16px;
            font-size: 18px;
        }
        p {
            color: #666;
            line-height: 1.7;
            font-size: 14px;
            margin-bottom: 12px;
        }
        .arrow-icon {
            font-size: 40px;
            color: #ff6700;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="tip-box" id="wechatTip" style="display: none;">
        <h3>当前为微信内置浏览器</h3>
        <p>请点击右上角 <strong>···</strong></p>
        <p>选择「在浏览器打开」即可正常访问</p>
        <div class="arrow-icon">↓</div>
    </div>

    <script>
        // 判断是否是微信浏览器
        function isWeChatBrowser() {
            const ua = navigator.userAgent.toLowerCase();
            return ua.indexOf('micromessenger') !== -1;
        }

        // 目标跳转链接（替换成你的网址）
        const targetUrl = "https://www.baidu.com";

        window.onload = function() {
            if (isWeChatBrowser()) {
                // 显示微信打开提示
                document.getElementById('wechatTip').style.display = 'block';
                // 微信无法JS直接强制跳转，只能引导用户手动打开
                console.log('微信环境，无法自动跳转，请引导用户右上角打开浏览器');
            } else {
                // 非微信环境，直接跳转
                window.location.href = targetUrl;
            }
        };
    </script>
</body>
</html>
