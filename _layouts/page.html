---
layout: default
---

<div class="container page-wrap">
  <header class="page-head">
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="page-sub">{{ page.subtitle }}</p>{% endif %}
  </header>

  <div class="prose">
    {{ content }}
  </div>

  <footer class="page-foot">
    <p>如内容有误或想交流，欢迎<a href="mailto:{{ site.author.email }}">邮件联系</a>。</p>
  </footer>
</div>
