<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

    <meta name="author" content="{{ site.author.name }}">
    <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    <meta name="keywords" content="{{ site.keywords }}">
    <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>

    <!-- ========== 新增：禁用页面缓存的核心配置 ========== -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <!-- 核心样式（新增动态版本号，避免CSS缓存） -->
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}">

    <!-- 页面专属样式（新增动态版本号） -->
    {% if page.custom_css %}
    {% for css in page.custom_css %}
    <link rel="stylesheet" href="{{ css | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}">
    {% endfor %}
    {% endif %}
</head>
<body>
<!-- 导航栏 -->
{% include header.html %}

<!-- 主内容区 -->
<main class="main-container">
    {{ content }}
</main>

<!-- 页脚 -->
{% include footer.html %}

<!-- 数学公式支持（所有页面加载） -->
{% include mathjax.html %}

<!-- 页面专属脚本（新增动态版本号，避免JS缓存） -->
{% if page.custom_js %}
{% for js in page.custom_js %}
<script src="{{ js | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}"></script>
{% endfor %}
{% endif %}
</body>
</html>
